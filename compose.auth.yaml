# Añadir al Compose base solo cuando los servicios de datos estén preparados.
services:
  web:
    env_file:
      - .secrets/app.env
      - .secrets/credits.env
      - path: .secrets/payments.env
        required: false
      - path: .secrets/stripe.env
        required: false
    environment:
      SUPABASE_URL: http://gateway:8000
      LOCAL_MAILBOX_URL: http://127.0.0.1:54324
    networks: [default, data]
  worker:
    env_file:
      - .secrets/worker.env
      - path: .secrets/mail.env
        required: false
    environment:
      APP_ENV: evaluation
      MAILPIT_URL: http://mail:8025
    networks: [default, data]
networks:
  data:
    external: true
    name: boletinexpress-data
