name: Comprobaciones
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "evidence/**", "README.md"]
  pull_request:
    paths-ignore: ["docs/**", "evidence/**", "README.md"]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24.22.0"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm audit --omit=dev --audit-level=high --prefix infra/supabase/storage-runtime
      - run: npm ci --ignore-scripts --prefix worker
      - run: npm audit --omit=dev --audit-level=high --prefix worker
      - run: npm run check
      - run: npm run build
      - run: npm ci --ignore-scripts --prefix tools/pdf-phase0
      - run: npm audit --audit-level=high --prefix tools/pdf-phase0
      - run: npm test --prefix tools/pdf-phase0
      - run: docker build --target web -t boletinexpress-web:phase1 .
      - run: docker build --target worker -t boletinexpress-worker:phase1 .
      - run: |
          node scripts/init-local-auth.mjs
          docker build --target gateway -t boletinexpress-gateway:phase3 .
          docker build --target templates -t boletinexpress-templates:phase3 .
          docker build --target database -t boletinexpress-postgres:phase3 .
          docker build --target storage -t boletinexpress-storage:phase3 .
          docker build --target auth -t boletinexpress-auth:phase3 .
          docker compose --env-file .secrets/supabase.env -f infra/supabase/compose.yaml up --detach --wait --wait-timeout 240
          sh scripts/apply-access.sh
          node scripts/init-worker-key.mjs

      - run: docker compose -f compose.yaml -f compose.auth.yaml up --detach --wait
      - run: node scripts/smoke.mjs
      - run: node scripts/check-demo-assets.mjs
      - id: isolation
        run: |
          set -o pipefail
          node scripts/test-isolation.mjs | tee evidence/phase-3/isolation.log
      - id: phase4
        run: |
          set -o pipefail
          node scripts/test-phase4.mjs | tee evidence/phase-4/integration.log
      - if: always() && steps.isolation.outcome != 'skipped'
        run: |
          docker builder prune --all --force
          docker tag boletinexpress-gateway:phase3 boletinexpress-gateway:phase1
          docker tag boletinexpress-templates:phase3 boletinexpress-templates:phase1
          docker tag boletinexpress-postgres:phase3 boletinexpress-postgres:phase1
          docker tag boletinexpress-auth:phase3 boletinexpress-auth:phase1
          docker tag postgrest/postgrest:v14.17 boletinexpress-rest:phase1
          docker tag boletinexpress-storage:phase3 boletinexpress-storage:phase1
          docker tag axllent/mailpit:v1.31.6 boletinexpress-mail:phase1
          BE_SCAN_REPORT_DIR=evidence/phase-3 BE_SCAN_SERVICES="web worker gateway templates postgres auth rest storage mail" sh scripts/scan-images.sh
      - if: failure()
        run: node scripts/diagnose-services.mjs
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase-3-evidence
          path: |
            evidence/phase-3
            evidence/phase-4
          retention-days: 7
      - if: always()
        run: |
          docker compose -f compose.yaml -f compose.auth.yaml down
          docker compose --env-file .secrets/supabase.env -f infra/supabase/compose.yaml down
