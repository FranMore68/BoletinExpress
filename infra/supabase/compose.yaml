name: boletinexpress-data
x-runtime: &runtime
  restart: unless-stopped
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging: {driver: json-file, options: {max-size: "5m", max-file: "2"}}
services:
  postgres:
    image: boletinexpress-postgres:phase3
    restart: unless-stopped
    mem_limit: 1280m
    cpus: 0.05
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: postgres
      POSTGRES_HOST: /var/run/postgresql
    command: [postgres, -c, config_file=/etc/postgresql/postgresql.conf, -c, shared_buffers=128MB, -c, max_connections=60, -c, log_min_messages=fatal, -c, log_statement=none]
    volumes:
      - db:/var/lib/postgresql/data
      - db-config:/etc/postgresql-custom
    healthcheck:
      test: [CMD, pg_isready, -U, postgres, -h, localhost]
      interval: 5s
      timeout: 5s
      retries: 30
    logging: {driver: json-file, options: {max-size: "5m", max-file: "2"}}
  auth:
    <<: *runtime
    image: boletinexpress-auth:phase3
    mem_limit: 128m
    cpus: 0.04
    depends_on: {postgres: {condition: service_healthy}, mail: {condition: service_started}}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:9999/health"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 12
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${APP_URL:?}
      GOTRUE_LOG_LEVEL: error
      GOTRUE_DB_MAX_POOL_SIZE: 10
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@postgres:5432/postgres
      GOTRUE_SITE_URL: ${APP_URL}
      GOTRUE_URI_ALLOW_LIST: ${APP_URL}/auth/confirm
      GOTRUE_DISABLE_SIGNUP: "false"
      # Auth 2.197 todavía usa DefaultGroupName al crear el usuario (signup.go).
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_EXP: 900
      GOTRUE_JWT_SECRET: ${JWT_SECRET:?}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_PASSWORD_MIN_LENGTH: 12
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-mail}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-1025}
      GOTRUE_SMTP_USER: ${SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${SMTP_PASS:-}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_FROM:-no-reply@boletinexpress.invalid}
      GOTRUE_SMTP_SENDER_NAME: BoletinExpress
      GOTRUE_SMTP_MAX_FREQUENCY: 1s
      GOTRUE_RATE_LIMIT_EMAIL_SENT: 100
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: http://templates:8080/confirmation.html
      GOTRUE_MAILER_TEMPLATES_RECOVERY: http://templates:8080/recovery.html
      GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED: "true"
      GOTRUE_SECURITY_REFRESH_TOKEN_REUSE_INTERVAL: 10
      GOTRUE_SESSIONS_TIMEBOX: 168h
      LOG_LEVEL: error
  rest:
    <<: *runtime
    image: postgrest/postgrest:v14.17
    mem_limit: 128m
    cpus: 0.03
    depends_on: {postgres: {condition: service_healthy}}
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@postgres:5432/postgres
      PGRST_DB_SCHEMAS: public,storage
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_POOL: 5
      PGRST_LOG_LEVEL: crit
  storage:
    <<: *runtime
    image: boletinexpress-storage:phase3
    mem_limit: 512m
    cpus: 0.10
    depends_on: {postgres: {condition: service_healthy}, rest: {condition: service_started}}
    environment:
      ANON_KEY: ${ANON_KEY:?}
      SERVICE_KEY: ${SERVICE_ROLE_KEY:?}
      AUTH_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@postgres:5432/postgres
      POSTGREST_URL: http://rest:3000
      STORAGE_PUBLIC_URL: ${APP_URL}
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      FILE_SIZE_LIMIT: 2097152
      TENANT_ID: boletinexpress
      GLOBAL_S3_BUCKET: boletinexpress
      REGION: local
      ENABLE_IMAGE_TRANSFORMATION: "false"
      LOG_LEVEL: error
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:5000/status"]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 12
    volumes: [files:/var/lib/storage]
  gateway:
    <<: *runtime
    image: boletinexpress-gateway:phase3
    mem_limit: 64m
    cpus: 0.01
    read_only: true
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8000/health"]
      interval: 5s
      timeout: 3s
      start_period: 60s
      retries: 30
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
    ports: ["127.0.0.1:54321:8000"]
    depends_on: {auth: {condition: service_healthy}, rest: {condition: service_started}, storage: {condition: service_healthy}}
  templates:
    <<: *runtime
    image: boletinexpress-templates:phase3
    mem_limit: 64m
    cpus: 0.01
    read_only: true
  mail:
    <<: *runtime
    image: axllent/mailpit:v1.31.6
    mem_limit: 64m
    cpus: 0.01
    environment:
      MP_MAX_MESSAGES: 100
      MP_DISABLE_VERSION_CHECK: "true"
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports: ["127.0.0.1:54324:8025"]
volumes:
  db: {name: boletinexpress-postgres-data}
  db-config: {name: boletinexpress-db-config}
  files: {name: boletinexpress-private-files}
networks:
  default: {name: boletinexpress-data}
