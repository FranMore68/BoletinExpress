name: boletinexpress-evaluation
services:
  web:
    image: ${BOLETINEXPRESS_WEB_IMAGE:-boletinexpress-web:phase1}
    ports: ["127.0.0.1:3000:3000"]
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.30
    pids_limit: 128
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m,uid=1000,gid=1000"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 3
    logging: &logging
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
  worker:
    image: ${BOLETINEXPRESS_WORKER_IMAGE:-boletinexpress-worker:phase1}
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 64
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m,uid=1000,gid=1000"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    logging: *logging
networks:
  default:
    name: boletinexpress-evaluation
